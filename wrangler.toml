# Wrangler configuration file
name = "simpage"
main = "worker.js"
compatibility_date = "2024-03-26"

# Daily wallpaper uses https://api.bimg.cc/today; no API key is required.

# KV Namespace bindings
# 1. SIMPAGE_DATA: Read-only source for the one-time AppStateDO migration.
# 2. SESSIONS: Read-only source for a bounded legacy-session migration window.
# 3. __STATIC_CONTENT: Stores all static assets (HTML, CSS, JS, images).
#    This name is required by the @cloudflare/kv-asset-handler library.
kv_namespaces = [
  { binding = "SIMPAGE_DATA", id = "b372dfdad69d4753af3cf891c184c68c", preview_id = "b372dfdad69d4753af3cf891c184c68c" },
  { binding = "SESSIONS", id = "4d66f25e98f0467b99de14a28a2a9e5d", preview_id = "4d66f25e98f0467b99de14a28a2a9e5d" },
]

[durable_objects]
bindings = [
  { name = "VISITOR_COUNTER", class_name = "VisitorCounterDO" },
  { name = "LOGIN_RATE_LIMIT", class_name = "LoginRateLimitDO" },
  { name = "APP_STATE", class_name = "AppStateDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorCounterDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LoginRateLimitDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AppStateDO"]

# Site configuration for static assets
# This tells Wrangler to upload the contents of the 'public' directory
# to the __STATIC_CONTENT KV namespace.
[site]
bucket = "./public"
