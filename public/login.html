<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录</title>
    <link rel="icon" id="site-favicon" href="/simpage-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/login.css" />
    <script type="module" src="/scripts/pages/login.js" defer></script>
  </head>
  <body class="login-body">
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <form class="login-card glass" id="login-form">
      <h1>后台登录</h1>
      <p class="description">请输入后台密码以继续访问管理面板。</p>
      <p class="login-error" id="login-error" role="alert" hidden></p>
      <div class="field">
        <span>密码</span>
        <input
          type="password"
          id="login-password"
          autocomplete="current-password"
          placeholder="请输入后台密码"
          required
          autofocus
        />
      </div>
      <button type="submit" class="primary-button" id="login-submit">登录</button>
      <a class="login-back" href="/">← 返回导航页</a>
    </form>
  </body>
</html>
