<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page</title>
    <link rel="dns-prefetch" href="//fonts.font.im" />
    <link rel="dns-prefetch" href="//bing.img.run" />
    <link rel="dns-prefetch" href="//v1.hitokoto.cn" />
    <link rel="preconnect" href="https://fonts.font.im" crossorigin />
    <noscript>
      <link rel="stylesheet" href="https://fonts.font.im/css2?family=LXGW+WenKai&display=swap" />
    </noscript>
    <link rel="icon" id="site-favicon" href="/simpage-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/main.css" />
    <script type="module" src="/scripts/features/font-loader.js" defer></script>
    <script type="module" src="/scripts/pages/home.js" defer></script>
  </head>
  <body>
     <!-- 🆕 添加壁纸容器 -->
    <div class="wallpaper-container" id="wallpaper-container"></div>
    <!-- 🆕 迷你浮动卡片（使用占位符，由 JS 动态更新） -->
  <div class="floating-summary" id="floating-summary" role="button" tabindex="0" aria-label="Back to top">
    <!-- 紧凑模式（默认显示） -->
    <div class="floating-compact">
      <span class="compact-badge" id="compact-badge">--</span>
      <span class="compact-divider">|</span>
      <span class="compact-progress" id="compact-progress">--</span>
      <span class="compact-divider">|</span>
      <span class="compact-weather" id="compact-weather">--</span>
    </div>
    
    <!-- 展开模式（悬停显示） -->
    <div class="floating-expanded">
      <div class="expanded-row">
        <span class="expanded-badge" id="expanded-badge">--</span>
        <span class="expanded-time" id="expanded-time">--:--:--</span>
      </div>
      <div class="expanded-date" id="expanded-date">--</div>
      <div class="expanded-lunar" id="expanded-lunar">--</div>
      <div class="expanded-progress" id="expanded-progress-full">--</div>
      <div class="expanded-weather" id="expanded-weather">--</div>
      <div class="expanded-hint">↑ 点击回到顶部</div>
    </div>
  </div>
  
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>
    <main class="layout">
      <section class="summary glass" aria-label="今日概览">
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换主题">
    <svg class="sun-icon" aria-hidden="true" focusable="false">
      <use href="/icons/sprite.svg#icon-sun"></use>
    </svg>
    <svg class="moon-icon" aria-hidden="true" focusable="false">
      <use href="/icons/sprite.svg#icon-moon"></use>
    </svg>
  </button>
  <div class="summary-main">
    <h1 class="sr-only" id="site-name">Page</h1>
    <div class="time-row">
      <div class="time-display" id="current-time">--:--:--</div>
      <span class="badge" id="dynamic-badge">☀️ 早安</span>
    </div>
    <div class="meta-line">
      <span class="date-display" id="current-date">--</span>
      <span class="meta-dot" aria-hidden="true">·</span>
      <span class="lunar-display" id="lunar-date">--</span>
    </div>
    <div class="greeting" id="greeting-text">欢迎回来</div>
    <div class="progress-display" id="today-progress" data-progress="0">
      <span class="progress-track" aria-hidden="true"><span class="progress-fill"></span></span>
      <span class="progress-text">今日已过 0%</span>
    </div>
  </div>
  <div class="summary-meta">
    <div class="weather-block">
      <span class="weather-label">天气</span>
      <p class="weather-info" id="weather-info">正在获取天气...</p>
    </div>
    <form class="search-form" id="global-search-form">
      <!-- 搜索表单内容保持不变 -->
      <label for="global-search" class="sr-only">搜索</label>
      <div class="search-controls">
        <div class="search-select" data-control="target">
          <label class="sr-only" for="search-target">搜索范围</label>
          <select id="search-target" name="target">
            <option value="web">搜索</option>
            <option value="apps">应用</option>
            <option value="bookmarks">书签</option>
          </select>
        </div>
        <div class="search-select" data-control="engine">
          <span class="sr-only" id="search-engine-label">搜索引擎</span>
          <input type="hidden" id="search-engine" name="engine" value="bing" />
          <div
            class="search-engine-toggle"
            role="group"
            aria-labelledby="search-engine-label"
          >
            <button
              type="button"
              class="search-engine-button is-active"
              data-engine-option="bing"
              aria-pressed="true"
              id="search-engine-bing"
              tabindex="0"
            >
              <span class="engine-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <use href="/icons/sprite.svg#icon-engine-bing"></use>
                </svg>
              </span>
              <span class="sr-only">Bing</span>
            </button>
            <button
              type="button"
              class="search-engine-button"
              data-engine-option="google"
              aria-pressed="false"
              id="search-engine-google"
              tabindex="-1"
            >
              <span class="engine-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <use href="/icons/sprite.svg#icon-engine-google"></use>
                </svg>
              </span>
              <span class="sr-only">Google</span>
            </button>
            <button
              type="button"
              class="search-engine-button"
              data-engine-option="baidu"
              aria-pressed="false"
              id="search-engine-baidu"
              tabindex="-1"
            >
              <span class="engine-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <use href="/icons/sprite.svg#icon-engine-baidu"></use>
                </svg>
              </span>
              <span class="sr-only">百度</span>
            </button>
          </div>
        </div>
      </div>
      <div class="search-input">
        <input
          type="search"
          id="global-search"
          name="query"
          placeholder="搜索网页、应用或书签..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <button type="submit">搜索</button>
      </div>
      <p class="search-feedback" id="local-search-feedback" hidden></p>
    </form>
  </div>
</section>

      <section class="grid-section glass" aria-labelledby="collections-title">
        <div class="section-header section-header-with-toggle">
          <div>
            <h2 id="collections-title">资源</h2>
            <p>我的在线应用与收藏站点</p>
          </div>
          <div
            class="collection-toggle"
            id="collection-toggle"
            role="tablist"
            aria-label="资源分类切换"
          >
            <button
              type="button"
              class="collection-toggle-button is-active"
              role="tab"
              id="apps-tab"
              data-view="apps"
              aria-controls="apps-panel"
              aria-selected="true"
              tabindex="0"
            >
              应用
            </button>
            <button
              type="button"
              class="collection-toggle-button"
              role="tab"
              id="bookmarks-tab"
              data-view="bookmarks"
              aria-controls="bookmarks-panel"
              aria-selected="false"
              tabindex="-1"
            >
              书签
            </button>
          </div>
        </div>
        <div class="collection-panels">
          <div
            class="collection-panel is-active"
            id="apps-panel"
            role="tabpanel"
            aria-labelledby="apps-tab"
          >
            <div class="grid" id="apps-grid" role="list"></div>
            <p class="empty-hint" id="apps-empty" hidden>
              暂无应用，请前往后台管理进行添加。
            </p>
          </div>
          <div
            class="collection-panel"
            id="bookmarks-panel"
            role="tabpanel"
            aria-labelledby="bookmarks-tab"
            hidden
          >
            <div class="bookmark-collection" id="bookmarks-grid"></div>
            <p class="empty-hint" id="bookmarks-empty" hidden>
              暂无书签，请前往后台管理进行添加。
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer" hidden>
      <div class="site-footer-inner">
        <div class="site-footer-content" id="site-footer-content"></div>
        <div class="site-footer-meta" id="site-footer-meta" hidden>
          <span class="site-footer-meta-label">已平稳运行</span>
          <span class="site-footer-meta-value" id="site-running-days">0</span>
          <span class="site-footer-meta-unit">天</span>
        </div>
        <div class="site-footer-meta" id="site-footer-visitors" hidden>
          <span class="site-footer-meta-label">访问</span>
          <span class="site-footer-meta-value" id="site-visitor-count">0</span>
          <span class="site-footer-meta-unit">次</span>
        </div>
      </div>
    </footer>

    <button type="button" class="back-to-top" id="back-to-top" aria-label="回到顶部" hidden>
      ⌃
    </button>
  </body>
</html>
